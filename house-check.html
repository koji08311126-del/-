<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f5f7f2;
  margin: 0;
  padding: 16px;
  color: #333;
}

h1 {
  text-align: center;
  color: #4f6f52;
  margin: 10px 0 5px;
}

.subtitle {
  text-align: center;
  color: #777;
  font-size: 14px;
  margin-bottom: 20px;
}

.period {
  margin-bottom: 12px;
}

.period-button {
  width: 100%;
  padding: 18px;
  border: none;
  border-radius: 15px;
  background: white;
  box-shadow: 0 2px 8px #ccc;
  font-size: 18px;
  font-weight: bold;
  color: #4f6f52;
  text-align: left;
}

.period-button span {
  float: right;
  font-size: 18px;
}

.period-content {
  display: none;
  background: white;
  margin-top: 6px;
  padding: 14px;
  border-radius: 0 0 15px 15px;
  box-shadow: 0 2px 8px #ccc;
}

.period-content.open {
  display: block;
}

.category {
  margin-top: 12px;
  padding: 9px 10px;
  background: #eef4eb;
  border-radius: 10px;
  font-weight: bold;
  color: #4f6f52;
}

.check-row {
  padding: 12px 4px;
  border-bottom: 1px solid #eee;
}

.check-title {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 16px;
  line-height: 1.5;
}

.check-title input {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
  margin-top: 1px;
}

.details {
  margin-left: 32px;
  margin-top: 10px;
}

.details label {
  display: block;
  font-size: 13px;
  color: #777;
  margin-top: 8px;
}

.details input,
.details textarea {
  width: 100%;
  box-sizing: border-box;
  margin-top: 4px;
  padding: 9px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 14px;
  background: #fafafa;
}

.details textarea {
  min-height: 55px;
}

.reset {
  display: block;
  width: 100%;
  padding: 13px;
  margin-top: 20px;
  background: #eee;
  border: none;
  border-radius: 10px;
  color: #555;
  font-size: 14px;
}

.back {
  display: block;
  text-align: center;
  margin: 25px 0 10px;
  padding: 14px;
  background: #4f6f52;
  color: white;
  text-decoration: none;
  border-radius: 12px;
  font-size: 16px;
}
</style>
</head>

<script>
function openAll() {
  document.querySelectorAll('.period-content').forEach(content => {
    content.classList.add('open');
  });

  document.querySelectorAll('.period-button span').forEach(span => {
    span.textContent = '−';
  });
}

function closeAll() {
  document.querySelectorAll('.period-content').forEach(content => {
    content.classList.remove('open');
  });

  document.querySelectorAll('.period-button span').forEach(span => {
    span.textContent = '＋';
  });
}
function togglePeriod(id, button) {

  const content = document.getElementById(id);
  const arrow = button.querySelector('span');

  if (content.classList.contains('open')) {
    content.classList.remove('open');
    arrow.textContent = '＋';
  } else {
    content.classList.add('open');
    arrow.textContent = '−';
  }

}


const rows = document.querySelectorAll('.check-row');

rows.forEach((row, index) => {

  const checkbox = row.querySelector('input[type="checkbox"]');
  const dateInputs = row.querySelectorAll('input[type="date"]');
  const textarea = row.querySelector('textarea');

  const saved = JSON.parse(
    localStorage.getItem('kurashi-item-' + index) || '{}'
  );

  checkbox.checked = saved.checked || false;

  if (dateInputs[0]) {
    dateInputs[0].value = saved.date || '';
  }

  if (textarea) {
    textarea.value = saved.memo || '';
  }

  if (dateInputs[1]) {
    dateInputs[1].value = saved.next || '';
  }

  function save() {

    localStorage.setItem(
      'kurashi-item-' + index,
      JSON.stringify({
        checked: checkbox.checked,
        date: dateInputs[0] ? dateInputs[0].value : '',
        memo: textarea ? textarea.value : '',
        next: dateInputs[1] ? dateInputs[1].value : ''
      })
    );

  }

  checkbox.addEventListener('change', save);

  dateInputs.forEach(input => {
    input.addEventListener('change', save);
  });

  if (textarea) {
    textarea.addEventListener('input', save);
  }

});


function resetChecks() {

  if (!confirm('チェック・日付・メモ・次回予定をすべてリセットしますか？')) {
    return;
  }

  rows.forEach((row, index) => {

    const checkbox = row.querySelector('input[type="checkbox"]');
    const dateInputs = row.querySelectorAll('input[type="date"]');
    const textarea = row.querySelector('textarea');

    checkbox.checked = false;

    dateInputs.forEach(input => {
      input.value = '';
    });

    if (textarea) {
      textarea.value = '';
    }

    localStorage.removeItem('kurashi-item-' + index);

  });

}

</script>
