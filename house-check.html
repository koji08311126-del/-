
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🌿 定期チェック</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f7f2;margin:0;padding:16px;color:#333}
h1{text-align:center;color:#4f6f52;margin:10px 0 5px}
.subtitle{text-align:center;color:#777;font-size:14px;margin-bottom:20px}
.actions{display:flex;gap:8px;margin-bottom:15px}
.actions button{flex:1;padding:12px 6px;border:0;border-radius:10px;font-weight:bold;font-size:14px}
.open-all{background:#e3eddf;color:#4f6f52}
.close-all{background:#eee;color:#555}
.period{margin-bottom:12px}
.period-button{width:100%;padding:16px 12px;border:0;border-radius:15px;background:white;box-shadow:0 2px 8px #ccc;font-size:16px;font-weight:bold;color:#4f6f52;text-align:left;display:flex;align-items:center;gap:8px}
.period-name{flex:1}
.progress-count{font-size:12px;font-weight:normal;color:#777;white-space:nowrap}
.arrow{font-size:18px}
.period-content{display:none;background:white;margin-top:6px;padding:12px;border-radius:0 0 15px 15px;box-shadow:0 2px 8px #ccc}
.period-content.open{display:block}
.category{margin-top:12px;padding:9px 10px;background:#eef4eb;border-radius:10px;font-weight:bold;color:#4f6f52}
.check-row{padding:12px 4px;border-bottom:1px solid #eee}
.check-title{display:flex;align-items:flex-start;gap:10px;font-size:15px;line-height:1.5}
.check-title input{width:22px;height:22px;flex-shrink:0;margin-top:1px}
.check-row.done .check-title .item-text{opacity:.5;text-decoration:line-through}
.details{margin-left:32px;margin-top:8px}
.details label{display:block;font-size:13px;color:#777;margin-top:8px}
.details input,.details textarea{width:100%;box-sizing:border-box;margin-top:4px;padding:9px;border:1px solid #ddd;border-radius:8px;font-size:14px;background:#fafafa}
.details textarea{min-height:50px}
.reset{width:100%;padding:13px;margin-top:20px;background:#eee;border:0;border-radius:10px;color:#555;font-size:14px}
.back{display:block;text-align:center;margin:22px 0 10px;padding:14px;background:#4f6f52;color:white;text-decoration:none;border-radius:12px}
</style>
</head>
<body>
<h1>🌿 定期チェック</h1>
<div class="subtitle">家・車・お金・家族を定期的に確認しましょう</div>

<div class="actions">
<button class="open-all" onclick="openAll()">＋ 全部開く</button>
<button class="close-all" onclick="closeAll()">− 全部閉じる</button>
</div>

<div id="periods"></div>

<button class="reset" onclick="resetChecks()">🔄 チェック・日付・メモをリセット</button>
<a class="back" href="index.html">🏠 トップページへ戻る</a>

<script>
const groups = [
{ id:"weekly", name:"🔍 毎週", categories:[
["🏠 家",["家の中で気になる音・におい・水漏れがないか確認","床・壁・天井などに新しい傷や異常がないか確認","水回りの水漏れ・カビ・排水を確認"]],
["🚗 車",["タイヤの空気圧・見た目を確認","車内・トランクの不要な物を整理"]],
["💰 お金",["今週の食費・生活費を確認","au PAY・PayPayなどの利用額を確認"]],
["❤️ 家族",["奥さんの体調や疲れ具合を気にかける","家のことで困っていることがないか聞く","「ありがとう」を言葉にする"]]
]},
{ id:"monthly", name:"📆 毎月", categories:[
["🏠 家",["エアコン・換気扇・フィルターを確認","網戸・窓・サッシを確認","ガス・給湯器の状態を確認","電気・ガス・水道料金を確認"]],
["🚗 車",["エンジンオイル交換時期を確認","タイヤの溝・傷・ひびを確認","ワイパー・ウォッシャー液を確認"]],
["💰 お金",["住宅ローン残高・金利を確認","クレジットカードの利用額を確認","NISAの積立状況を確認","貯金・予備資金を確認"]],
["❤️ 家族",["家族で今月困ったことがなかったか振り返る","夫婦で一緒に過ごす時間を作る"]]
]},
{ id:"seasonal", name:"🌸 季節ごと", categories:[
["🏠 家",["エアコンのフィルター・室外機を確認","雨樋・屋根・外壁を目視確認","庭・植木・雑草を確認","網戸・窓・シャッターを確認"]],
["🚗 車",["季節タイヤ・タイヤ状態を確認","バッテリーの状態を確認"]]
]},
{ id:"halfyear", name:"🗓️ 半年ごと", categories:[
["🏠 家",["給湯器・ガス設備の状態を確認","水漏れ・配管・排水を確認","床鳴り・建具・ドア・鍵を確認","屋根・外壁・雨樋を詳しく確認"]],
["🚗 車",["タイヤ・ブレーキなどを点検","車検・点検予定を確認"]],
["💰 お金",["保険内容を確認","住宅ローン金利を確認"]]
]},
{ id:"yearly", name:"📋 年1回", categories:[
["🏠 家",["火災報知器を確認","屋根・外壁を点検","大きな修理・交換予定を整理","家の修理履歴を整理"]],
["🚗 車",["車検・法定点検を確認","自動車保険を確認","タイヤ交換時期を確認"]],
["💰 お金",["家計全体を見直す","保険を見直す","NISA・資産運用を見直す","住宅ローンの今後を確認"]],
["❤️ 家族",["家族旅行・夫婦の予定を考える","家族それぞれの希望を確認する"]]
]}
];

const root=document.getElementById("periods");

groups.forEach(group=>{
 const section=document.createElement("section");
 section.className="period";
 section.innerHTML=`
 <button class="period-button" onclick="togglePeriod('${group.id}',this)">
 <span class="period-name">${group.name}</span>
 <span class="progress-count" id="count-${group.id}">0 / 0 完了</span>
 <span class="arrow">＋</span></button>
 <div class="period-content" id="${group.id}"></div>`;
 const content=section.querySelector(".period-content");

 group.categories.forEach(category=>{
  const heading=document.createElement("div");
  heading.className="category";
  heading.textContent=category[0];
  content.appendChild(heading);

  category[1].forEach(item=>{
   const row=document.createElement("div");
   row.className="check-row";
   const key="kurashi-v2-"+group.id+"-"+item;
   row.dataset.key=key;
   row.innerHTML=`
   <div class="check-title">
   <input type="checkbox">
   <span class="item-text"></span>
   </div>
   <div class="details">
   <label>📅 実施日</label><input type="date" class="done-date">
   <label>📝 メモ</label><textarea placeholder="気づいたことを記録"></textarea>
   <label>🔔 次回予定</label><input type="date" class="next-date">
   </div>`;
   row.querySelector(".item-text").textContent=item;
   content.appendChild(row);

   const saved=JSON.parse(localStorage.getItem(key)||"{}");
   const checkbox=row.querySelector('input[type="checkbox"]');
   const doneDate=row.querySelector(".done-date");
   const memo=row.querySelector("textarea");
   const nextDate=row.querySelector(".next-date");

   checkbox.checked=!!saved.checked;
   doneDate.value=saved.date||"";
   memo.value=saved.memo||"";
   nextDate.value=saved.next||"";
   row.classList.toggle("done",checkbox.checked);

   function save(){
    localStorage.setItem(key,JSON.stringify({
     checked:checkbox.checked,date:doneDate.value,
     memo:memo.value,next:nextDate.value
    }));
    row.classList.toggle("done",checkbox.checked);
    updateProgress();
   }
   checkbox.addEventListener("change",save);
   doneDate.addEventListener("change",save);
   memo.addEventListener("input",save);
   nextDate.addEventListener("change",save);
  });
 });
 root.appendChild(section);
});

function togglePeriod(id,button){
 const content=document.getElementById(id);
 content.classList.toggle("open");
 button.querySelector(".arrow").textContent=content.classList.contains("open")?"−":"＋";
}
function openAll(){
 document.querySelectorAll(".period-content").forEach(el=>el.classList.add("open"));
 document.querySelectorAll(".arrow").forEach(el=>el.textContent="−");
}
function closeAll(){
 document.querySelectorAll(".period-content").forEach(el=>el.classList.remove("open"));
 document.querySelectorAll(".arrow").forEach(el=>el.textContent="＋");
}
function updateProgress(){
 groups.forEach(group=>{
  const section=document.querySelector("#"+group.id).closest(".period");
  const rows=section.querySelectorAll(".check-row");
  const checked=section.querySelectorAll('.check-row input[type="checkbox"]:checked').length;
  document.getElementById("count-"+group.id).textContent=checked+" / "+rows.length+" 完了";
 });
}
function resetChecks(){
 if(!confirm("このページのチェック・日付・メモ・次回予定をすべてリセットしますか？"))return;
 document.querySelectorAll(".check-row").forEach(row=>{
  localStorage.removeItem(row.dataset.key);
  row.querySelector('input[type="checkbox"]').checked=false;
  row.querySelector(".done-date").value="";
  row.querySelector("textarea").value="";
  row.querySelector(".next-date").value="";
  row.classList.remove("done");
 });
 updateProgress();
}
updateProgress();
</script>
</body>
</html>
