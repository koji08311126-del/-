<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📅 定期チェック</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f5f7f2;
  margin: 0;
  padding: 20px;
  color: #333;
}

h1 {
  text-align: center;
  color: #4f6f52;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  color: #777;
  margin-bottom: 25px;
  line-height: 1.6;
}

.section {
  background: white;
  margin-bottom: 20px;
  padding: 18px;
  border-radius: 15px;
  box-shadow: 0 2px 8px #ccc;
}

.section h2 {
  margin-top: 0;
  color: #4f6f52;
  font-size: 20px;
}

.section p {
  color: #777;
  line-height: 1.5;
}

.check-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 13px 5px;
  border-bottom: 1px solid #eee;
  line-height: 1.5;
}

.check-item:last-child {
  border-bottom: none;
}

.check-item input {
  width: 22px;
  height: 22px;
  margin-top: 1px;
  flex-shrink: 0;
}

.check-item label {
  font-size: 16px;
}

.done {
  text-decoration: line-through;
  color: #999;
}

.date-box {
  background: white;
  padding: 18px;
  margin-bottom: 20px;
  border-radius: 15px;
  box-shadow: 0 2px 8px #ccc;
}

.date-box label {
  display: block;
  font-weight: bold;
  color: #4f6f52;
  margin-bottom: 8px;
}

.date-box input {
  width: 100%;
  box-sizing: border-box;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 17px;
}

.progress {
  text-align: center;
  background: #e8eee5;
  padding: 14px;
  border-radius: 12px;
  margin-bottom: 20px;
  color: #4f6f52;
  font-weight: bold;
}

.reset-button {
  display: block;
  width: 100%;
  padding: 14px;
  margin-top: 5px;
  margin-bottom: 15px;
  border: none;
  border-radius: 10px;
  background: #777;
  color: white;
  font-size: 16px;
}

.back {
  display: block;
  margin-top: 25px;
  padding: 15px;
  text-align: center;
  background: #4f6f52;
  color: white;
  text-decoration: none;
  border-radius: 12px;
}

.note {
  background: #fffdf2;
  border-left: 4px solid #d4b45c;
  padding: 14px;
  margin-bottom: 20px;
  border-radius: 8px;
  line-height: 1.6;
  font-size: 14px;
}
</style>
</head>

<body>

<h1>📅 定期チェック</h1>

<div class="subtitle">
家の異常を早めに見つけて、大きな修理を防ぐためのチェック
</div>

<div class="date-box">

<label>📅 今回チェックした日</label>

<input type="date" id="checkDate">

</div>

<div class="progress" id="progress">
チェック済み：0 / 0
</div>

<div class="note">
⚠️ 屋根には上らず、地上から確認してください。<br>
ガス臭・焦げ臭・電気の異常・大きな水漏れなど、危険を感じる場合は無理にDIYせず専門業者へ。
</div>

<div class="section">

<h2>🔍 毎週チェック</h2>

<p>5〜10分程度で確認します。</p>

<div class="check-item">
<input type="checkbox" id="weekly1">
<label for="weekly1">水漏れ・床の水たまりがないか</label>
</div>

<div class="check-item">
<input type="checkbox" id="weekly2">
<label for="weekly2">ガス臭・異常な臭いがないか</label>
</div>

<div class="check-item">
<input type="checkbox" id="weekly3">
<label for="weekly3">コンセント・電気製品に焦げ臭さや異常がないか</label>
</div>

<div class="check-item">
<input type="checkbox" id="weekly4">
<label for="weekly4">エアコンから異音・水漏れがないか</label>
</div>

<div class="check-item">
<input type="checkbox" id="weekly5">
<label for="weekly5">天井・壁に新しいシミやひびがないか</label>
</div>

<div class="check-item">
<input type="checkbox" id="weekly6">
<label for="weekly6">床・階段・手すりに異常がないか</label>
</div>

<div class="check-item">
<input type="checkbox" id="weekly7">
<label for="weekly7">窓・網戸・鍵に異常がないか</label>
</div>

<div class="check-item">
<input type="checkbox" id="weekly8">
<label for="weekly8">庭・駐車場に危険な物や障害物がないか</label>
</div>

</div>

<div class="section">

<h2>📆 毎月チェック</h2>

<p>20〜30分程度で確認します。</p>

<div class="check-item">
<input type="checkbox" id="monthly1">
<label for="monthly1">キッチン・洗面台・トイレ下の水漏れ確認</label>
</div>

<div class="check-item">
<input type="checkbox" id="monthly2">
<label for="monthly2">お風呂・排水口・カビの確認</label>
</div>

<div class="check-item">
<input type="checkbox" id="monthly3">
<label for="monthly3">給湯器・ガス機器の異常確認</label>
</div>

<div class="check-item">
<input type="checkbox" id="monthly4">
<label for="monthly4">分電盤・ブレーカーに異常がないか</label>
</div>

<div class="check-item">
<input type="checkbox" id="monthly5">
<label for="monthly5">コンセント・延長コードの発熱や傷を確認</label>
</div>

<div class="check-item">
<input type="checkbox" id="monthly6">
<label for="monthly6">床鳴り・壁・天井・建具の変化を確認</label>
</div>

<div class="check-item">
<input type="checkbox" id="monthly7">
<label for="monthly7">雨樋・排水口にゴミがたまっていないか</label>
</div>

<div class="check-item">
<input type="checkbox" id="monthly8">
<label for="monthly8">庭木・雑草・害虫を確認</label>
</div>

<div class="check-item">
<input type="checkbox" id="monthly9">
<label for="monthly9">フェンス・ブロック・外構の異常確認</label>
</div>

</div>

<div class="section">

<h2>🌸☀️🍂❄️ 季節ごとのチェック</h2>

<div class="check-item">
<input type="checkbox" id="season1">
<label for="season1">春：庭木の剪定・害虫・網戸・エアコンを確認</label>
</div>

<div class="check-item">
<input type="checkbox" id="season2">
<label for="season2">夏：エアコン・室外機・排水・蚊や蜂などを確認</label>
</div>

<div class="check-item">
<input type="checkbox" id="season3">
<label for="season3">秋：落ち葉・雨樋・台風後の屋根や外壁を確認</label>
</div>

<div class="check-item">
<input type="checkbox" id="season4">
<label for="season4">冬：給湯器・水道・暖房・凍結対策を確認</label>
</div>

</div>

<div class="section">

<h2>🗓️ 半年ごとのチェック</h2>

<div class="check-item">
<input type="checkbox" id="half1">
<label for="half1">屋根を地上から確認</label>
</div>

<div class="check-item">
<input type="checkbox" id="half2">
<label for="half2">外壁のひび・剥がれ・変色を確認</label>
</div>

<div class="check-item">
<input type="checkbox" id="half3">
<label for="half3">雨樋・軒天・破風などを確認</label>
</div>

<div class="check-item">
<input type="checkbox" id="half4">
<label for="half4">窓・網戸・シャッターを確認</label>
</div>

<div class="check-item">
<input type="checkbox" id="half5">
<label for="half5">フェンス・ブロック・駐車場を確認</label>
</div>

<div class="check-item">
<input type="checkbox" id="half6">
<label for="half6">庭木・大きな枝・倒木の危険を確認</label>
</div>

</div>

<div class="section">

<h2>📋 年1回チェック</h2>

<div class="check-item">
<input type="checkbox" id="year1">
<label for="year1">火災報知器の動作確認</label>
</div>

<div class="check-item">
<input type="checkbox" id="year2">
<label for="year2">消火器・防災用品を確認</label>
</div>

<div class="check-item">
<input type="checkbox" id="year3">
<label for="year3">家全体の水漏れ・雨漏りを確認</label>
</div>

<div class="check-item">
<input type="checkbox" id="year4">
<label for="year4">屋根・外壁の状態を確認</label>
</div>

<div class="check-item">
<input type="checkbox" id="year5">
<label for="year5">ガス・電気設備を確認</label>
</div>

<div class="check-item">
<input type="checkbox" id="year6">
<label for="year6">給湯器・エアコン・ガスコンロなどの使用年数を確認</label>
</div>

<div class="check-item">
<input type="checkbox" id="year7">
<label for="year7">家の修理・交換履歴と費用を確認</label>
</div>

<div class="check-item">
<input type="checkbox" id="year8">
<label for="year8">大きな修理が必要になりそうな場所を確認</label>
</div>

</div>

<button class="reset-button" onclick="resetChecks()">
☑️ チェックを全部リセット
</button>

<a class="back" href="house.html">
← 🏠 家のことに戻る
</a>

<script>

const checkboxes = document.querySelectorAll(
  'input[type="checkbox"]'
);

const checkDate = document.getElementById("checkDate");

function updateProgress() {

  let checked = 0;

  checkboxes.forEach(box => {

    if (box.checked) {
      checked++;
      box.parentElement.classList.add("done");
    } else {
      box.parentElement.classList.remove("done");
    }

  });

  document.getElementById("progress").textContent =
    "チェック済み：" + checked + " / " + checkboxes.length;

  saveChecks();
}

function saveChecks() {

  const data = {};

  checkboxes.forEach(box => {
    data[box.id] = box.checked;
  });

  localStorage.setItem(
    "houseCheckData",
    JSON.stringify(data)
  );

  localStorage.setItem(
    "houseCheckDate",
    checkDate.value
  );
}

function loadChecks() {

  const data = JSON.parse(
    localStorage.getItem("houseCheckData") || "{}"
  );

  checkboxes.forEach(box => {

    box.checked = data[box.id] || false;

  });

  checkDate.value =
    localStorage.getItem("houseCheckDate") || "";

  updateProgress();
}

function resetChecks() {

  if (!confirm("チェックを全部リセットしますか？")) {
    return;
  }

  checkboxes.forEach(box => {
    box.checked = false;
  });

  updateProgress();
}

checkboxes.forEach(box => {
  box.addEventListener("change", updateProgress);
});

checkDate.addEventListener("change", saveChecks);

loadChecks();

</script>

</body>
</html>
