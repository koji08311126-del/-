<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🏠 屋根・外壁</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f5f7f2;
  margin: 0;
  padding: 20px;
  color: #333;
}

h1 {
  text-align: center;
  color: #4f6f52;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  color: #777;
  margin-bottom: 25px;
}

.add-button {
  display: block;
  width: 100%;
  padding: 16px;
  margin-bottom: 20px;
  border: none;
  border-radius: 12px;
  background: #4f6f52;
  color: white;
  font-size: 18px;
  font-weight: bold;
}

.form {
  display: none;
  background: white;
  padding: 18px;
  margin-bottom: 20px;
  border-radius: 15px;
  box-shadow: 0 2px 8px #ccc;
}

.form.show {
  display: block;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 6px;
  font-weight: bold;
  color: #4f6f52;
}

input,
select,
textarea {
  display: block;
  width: 100%;
  box-sizing: border-box;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 8px;
  background: white;
  color: #333;
  font-size: 17px;
  font-family: inherit;
}

textarea {
  min-height: 100px;
}

.save-button {
  width: 100%;
  padding: 15px;
  margin-top: 20px;
  border: none;
  border-radius: 10px;
  background: #6f8f72;
  color: white;
  font-size: 17px;
}

.cancel-button {
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  border: 1px solid #aaa;
  border-radius: 10px;
  background: white;
  font-size: 16px;
}

.card {
  background: white;
  padding: 18px;
  margin-bottom: 15px;
  border-radius: 15px;
  box-shadow: 0 2px 8px #ccc;
}

.card h2 {
  margin: 0 0 12px;
  color: #4f6f52;
  font-size: 19px;
}

.info {
  margin: 9px 0;
  line-height: 1.6;
}

.label {
  font-weight: bold;
  color: #4f6f52;
}

.empty {
  text-align: center;
  color: #888;
  line-height: 1.7;
}

.delete-button {
  margin-top: 12px;
  padding: 9px 12px;
  border: none;
  border-radius: 8px;
  background: #eee;
  color: #666;
}

.back {
  display: block;
  margin-top: 25px;
  padding: 15px;
  text-align: center;
  background: #4f6f52;
  color: white;
  text-decoration: none;
  border-radius: 12px;
}
</style>
</head>

<body>

<h1>🏠 屋根・外壁</h1>

<div class="subtitle">
屋根・外壁・塗装・雨漏り・補修の記録
</div>

<button class="add-button" onclick="showForm()">
＋ 点検・修理記録を追加
</button>

<div class="form" id="form">

<h2>📝 記録を入力</h2>

<label>📅 日付</label>
<input type="date" id="date">

<label>🏠 場所</label>
<select id="place">
<option value="">選択してください</option>
<option>屋根</option>
<option>外壁</option>
<option>雨樋</option>
<option>軒天</option>
<option>破風・鼻隠し</option>
<option>その他</option>
</select>

<label>🔍 状態・困っていたこと</label>
<textarea id="symptom"
placeholder="例：外壁にひび割れがあった"></textarea>

<label>🔧 点検・修理内容</label>
<textarea id="repair"
placeholder="例：ひび割れを確認し、コーキング補修した"></textarea>

<label>🎨 塗装・材料</label>
<input type="text" id="material"
placeholder="例：シリコン塗料・変成シリコン">

<label>💰 費用</label>
<input type="number" id="cost"
placeholder="例：5000">

<label>📝 作業後の状態</label>
<textarea id="result"
placeholder="例：雨水の侵入がなくなった"></textarea>

<button class="save-button" onclick="saveRecord()">
保存する
</button>

<button class="cancel-button" onclick="hideForm()">
キャンセル
</button>

</div>

<div id="records"></div>

<a class="back" href="house.html">
← 🏠 家のことに戻る
</a>

<script>

let records = JSON.parse(
  localStorage.getItem("roofRecords") || "[]"
);

function showForm() {
  document.getElementById("form").classList.add("show");
}

function hideForm() {
  document.getElementById("form").classList.remove("show");
}

function saveRecord() {

  const record = {
    id: Date.now(),
    date: document.getElementById("date").value,
    place: document.getElementById("place").value,
    symptom: document.getElementById("symptom").value,
    repair: document.getElementById("repair").value,
    material: document.getElementById("material").value,
    cost: document.getElementById("cost").value,
    result: document.getElementById("result").value
  };

  if (!record.date || !record.place || !record.symptom) {
    alert("日付・場所・状態を入力してください。");
    return;
  }

  records.unshift(record);

  localStorage.setItem(
    "roofRecords",
    JSON.stringify(records)
  );

  document.getElementById("date").value = "";
  document.getElementById("place").value = "";
  document.getElementById("symptom").value = "";
  document.getElementById("repair").value = "";
  document.getElementById("material").value = "";
  document.getElementById("cost").value = "";
  document.getElementById("result").value = "";

  hideForm();
  displayRecords();
}

function deleteRecord(id) {

  if (!confirm("この記録を削除しますか？")) {
    return;
  }

  records = records.filter(
    record => record.id !== id
  );

  localStorage.setItem(
    "roofRecords",
    JSON.stringify(records)
  );

  displayRecords();
}

function displayRecords() {

  const container = document.getElementById("records");

  if (records.length === 0) {
    container.innerHTML = `
      <div class="card empty">
        まだ記録はありません。<br>
        「＋ 点検・修理記録を追加」から登録できます。
      </div>
    `;
    return;
  }

  container.innerHTML = records.map(record => `
    <div class="card">

      <h2>🏠 屋根・外壁記録</h2>

      <div class="info">
        <span class="label">📅 日付：</span>
        ${record.date}
      </div>

      <div class="info">
        <span class="label">🏠 場所：</span>
        ${record.place}
      </div>

      <div class="info">
        <span class="label">🔍 状態：</span><br>
        ${record.symptom}
      </div>

      <div class="info">
        <span class="label">🔧 修理内容：</span><br>
        ${record.repair || "未記入"}
      </div>

      <div class="info">
        <span class="label">🎨 塗装・材料：</span>
        ${record.material || "未記入"}
      </div>

      <div class="info">
        <span class="label">💰 費用：</span>
        ${record.cost ? record.cost + "円" : "未記入"}
      </div>

      <div class="info">
        <span class="label">📝 作業後：</span><br>
        ${record.result || "未記入"}
      </div>

      <button class="delete-button"
        onclick="deleteRecord(${record.id})">
        この記録を削除
      </button>

    </div>
  `).join("");
}

displayRecords();

</script>

</body>
</html>
